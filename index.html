<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareCycle — Quarantine Ward Tracker</title>
<style>
:root{
  --bg:#f3f6f8;--card:#fff;--ink:#14202b;--muted:#5d6b7a;--line:#e3e8ee;
  --brand:#0f766e;--brand-d:#115e59;--brand-l:#e6f4f2;
  --ok:#15803d;--ok-l:#e8f6ec;--warn:#b45309;--warn-l:#fdf3e1;--bad:#c62828;--bad-l:#fdeaea;
  --info:#1d4ed8;--info-l:#e8efff;--grey-l:#eef1f4;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:#0b3b38;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.2px}
.logo{width:28px;height:28px;border-radius:8px;background:#14b8a6;display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:0}
.demo{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.35);padding:4px 6px 4px 10px;border-radius:999px;font-size:12px}
.demo b{font-weight:600}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:5px 11px;font-size:12px}
.tbtn:hover{background:rgba(255,255,255,.26)}
.bell{position:relative;background:transparent;border:0;color:#fff;font-size:18px;padding:4px 8px}
.bell .cnt{position:absolute;top:-2px;right:0;background:#ef4444;color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.av.nurse{background:#7c3aed}.av.doctor{background:#2563eb}.av.head{background:#be185d}.av.admin{background:#d97706}
/* nav */
.nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto}
.nav button{background:none;border:0;padding:12px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.nav button.on{color:var(--brand-d);border-bottom-color:var(--brand)}
.nav .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--grey-l);font-size:11px;margin-left:4px;color:var(--ink)}
.nav button.on .n{background:var(--brand-l);color:var(--brand-d)}
.nav .n.hot{background:var(--bad);color:#fff}
main{max-width:1180px;margin:0 auto;padding:18px}
h2{margin:0 0 4px;font-size:20px} h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--muted);margin:0 0 14px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-l);color:var(--ok)} .c-warn{background:var(--warn-l);color:var(--warn)} .c-bad{background:var(--bad-l);color:var(--bad)}
.c-info{background:var(--info-l);color:var(--info)} .c-grey{background:var(--grey-l);color:var(--muted)} .c-brand{background:var(--brand-l);color:var(--brand-d)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;color:var(--ink)}
.btn:hover{background:#f7f9fb}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.btn.danger{background:#fff;border-color:#f3b4b4;color:var(--bad)}.btn.danger:hover{background:var(--bad-l)}
.btn.dangerf{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
/* progress */
.prog{height:8px;border-radius:99px;background:var(--grey-l);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--brand);border-radius:99px}
/* patient cards (nurse) */
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);border-left:4px solid var(--warn)}
.pcard.done{border-left-color:var(--ok)} .pcard.prio{border-left-color:var(--bad);background:#fffafa}
.room{font-weight:800;font-size:15px;letter-spacing:.3px}
.pname{font-weight:600}
.dots{letter-spacing:2px;font-size:13px}
.dot-on{color:var(--ok)} .dot-off{color:#cbd3dc}
.recd{background:var(--ok-l);color:#14532d;border-radius:8px;padding:6px 9px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.recd.fev{background:var(--bad-l);color:#7f1d1d}
/* toolbar */
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.inp{border:1px solid #cfd7e0;border-radius:9px;padding:8px 10px;background:#fff;min-width:0}
.inp:focus{outline:2px solid #99f6e4;border-color:var(--brand)}
/* list table */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.li{display:grid;grid-template-columns:70px 1.6fr 1fr 1.2fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.h{background:#f8fafb;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:8px 14px}
.li.click{cursor:pointer}.li.click:hover{background:#f9fbfc}
.empty{padding:34px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:10px 13px;margin:0 0 12px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:var(--ok-l);color:#14532d}.banner.warn{background:var(--warn-l);color:#78350f}.banner.bad{background:var(--bad-l);color:#7f1d1d}.banner.info{background:var(--info-l);color:#1e3a8a}.banner.grey{background:var(--grey-l);color:var(--muted)}
/* beds */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.bed{border-radius:9px;padding:7px 4px;text-align:center;font-size:12px;font-weight:700;border:1px solid transparent;cursor:pointer}
.bed small{display:block;font-weight:500;font-size:10px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed.free{background:#fff;border:1.5px dashed #16a34a;color:#15803d}
.bed.occ{background:#e8eef5;color:#334155}
.bed.pend{background:#fef3c7;color:#92400e;border-color:#f59e0b}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.meter{position:relative;height:10px;background:var(--grey-l);border-radius:99px;margin:10px 0 4px}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.meter>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:#111}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:14px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(820px,100%)}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.mb{padding:16px 18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfc;border-radius:0 0 16px 16px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);margin-left:auto}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:#344054}
.bigtemp{font-size:30px;font-weight:700;text-align:center;padding:10px;width:100%}
.msg{min-height:22px;font-size:13px;font-weight:500;margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv>span:nth-child(odd){color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid #f0f2f5}
/* toast */
#toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#111827;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;max-width:92vw}
.toast.ok{background:#14532d}.toast.bad{background:#991b1b}.toast.warn{background:#92400e}
/* notifications */
.np{position:fixed;top:56px;right:14px;width:min(380px,94vw);max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.18);z-index:40}
.np .it{padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.np .it.unread{background:#f0fdfa}
/* login */
.login{max-width:980px;margin:0 auto;padding:34px 18px}
.hero{background:linear-gradient(135deg,#0b3b38,#0f766e);color:#fff;border-radius:18px;padding:26px 26px;margin-bottom:20px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0;opacity:.9;max-width:700px}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ucard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.ucard:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.cycle{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:12.5px}
.cycle span{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px}
@media(max-width:720px){
  .li{grid-template-columns:56px 1fr auto;}
  .li .hide-m{display:none}
  main{padding:12px}
  .top{padding:8px 12px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="np-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
"use strict";
/* ============ constants ============ */
const BASE_DATE=new Date(2026,10,12);
const KEY='carecycle-demo-v1';
const USERS=[
  {id:'n1',name:'Priya Nair',role:'nurse',title:'Staff Nurse'},
  {id:'n2',name:'Rahul Pawar',role:'nurse',title:'Staff Nurse'},
  {id:'d1',name:'Dr. Ananya Mehta',role:'doctor',title:'Physician'},
  {id:'h1',name:'Dr. Kavita Rao',role:'head',title:'Head Doctor'},
  {id:'a1',name:'Suresh Iyer',role:'admin',title:'Admin Staff'}
];
const ROLE_LABEL={nurse:'Nurse',doctor:'Doctor',head:'Head Doctor',admin:'Admin Staff'};
const ROOMS=[];for(const w of['A','B'])for(let i=1;i<=37;i++)ROOMS.push(w+String(i).padStart(2,'0'));
const TREATMENTS=['Observation only','Antipyretic (paracetamol)','IV fluids','Antiviral course','Oxygen support','Close monitoring (4-hourly)'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MIN_F=93,MAX_F=108,HIGH_F=103,TARGET=85,MORT_LIMIT=15;

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateOf(d){const x=new Date(BASE_DATE);x.setDate(x.getDate()+d);return x}
function dl(d){const x=dateOf(d);return x.getDate()+' '+MON[x.getMonth()]}
function dlong(d){const x=dateOf(d);return DOW[x.getDay()]+', '+x.getDate()+' '+MON[x.getMonth()]+' '+x.getFullYear()}
function tsFor(d,h,m){const x=dateOf(d);x.setHours(h,m,0,0);return x.getTime()}
function hm(ts){const x=new Date(ts);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}
function nowTs(){const n=new Date();return tsFor(S.today,n.getHours(),n.getMinutes())}
function rel(d){return d===S.today?'today':d===S.today-1?'yesterday':dl(d)}
function f2c(f){return (f-32)*5/9} function c2f(c){return c*9/5+32}
function fmtT(t){return t.toFixed(1)+'°F'}
function uname(id){const u=USERS.find(u=>u.id===id);return u?u.name:id==='sys'?'System':id}
function short(id){const n=uname(id);const p=n.replace('Dr. ','Dr ').split(' ');return p.length>1?p[0]+' '+p[1][0]+'.':n}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ state ============ */
let S=null;
const UI={tab:{nurse:'rounds',doctor:'ready',admin:'queue',head:'dashboard'},nf:'pending',ward:'all',q:'',dq:'',np:false,unit:'F'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}

function seed(){
  const R=mulberry32(20261112);
  const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  const rf=(a,b)=>Math.round((a+R()*(b-a))*10)/10;
  const pick=a=>a[Math.floor(R()*a.length)];
  const FM=['Aarav','Vihaan','Aditya','Sai','Arjun','Reyansh','Kabir','Ishaan','Rohan','Kunal','Nikhil','Amit','Rakesh','Imran','Joseph','Farhan','Siddharth','Manish','Yash','Pranav'],FF=['Ananya','Diya','Saanvi','Aadhya','Kavya','Meera','Pooja','Sneha','Fatima','Neha','Riya','Shreya','Lakshmi','Sunita','Nisha','Zoya','Tanvi','Mary','Gauri','Ritu'];
  const LN=['Sharma','Patel','Deshmukh','Kulkarni','Iyer','Reddy','Khan','Fernandes','Joshi','Gupta','Nair','Menon','Shaikh','Pillai','Chopra','Bose','Jain','Mehta','Rane','Sawant','Kapoor','Desai','Verma','Naik','D\'Souza','Bhatt','Gokhale','Pandey'];
  const st={v:1,today:0,settings:{feverF:100.4,minSample:20},patients:[],notifs:[],audit:[],user:null,seq:1001};
  const used=new Set();
  const nm=sx=>{let n;do{n=pick(sx==='M'?FM:FF)+' '+pick(LN)}while(used.has(n));used.add(n);return n};
  const newP=o=>{const sx=R()<.5?'M':'F';const p=Object.assign({id:'P-'+(st.seq++),name:nm(sx),age:ri(18,79),sex:sx,phone:'9'+ri(100000000,999999999),readings:{},visits:{},priority:false},o);st.patients.push(p);return p};
  // closed historical cases: 46 recovered, 8 deceased  => 85.2% success
  for(let i=0;i<54;i++){
    const died=i%7===3&&i<56; // spreads 8 deaths
    const closed=-ri(1,56),los=ri(5,14);
    const p=newP({room:null,lastRoom:pick(ROOMS),admitDay:closed-los,closedDay:closed,status:died?'deceased':'discharged',closedBy:died?'d1':'a1'});
    if(!died)p.eligibleDay=closed-pick([0,0,1,1,1,2,2,3]);
  }
  // active patients: 72 of 74 rooms occupied
  const freeRooms=new Set(['A17','B30']);
  const occ=ROOMS.filter(r=>!freeRooms.has(r));
  occ.forEach((room,i)=>{
    const admitDay=-ri(1,12);
    const roll=R();let k=roll<.5?-1:roll<.68?1:roll<.86?2:3;
    let recoverDay=k<0?ri(1,4):-k;
    if(recoverDay<=admitDay)recoverDay=admitDay+1;
    const p=newP({room,admitDay,status:'admitted',recoverDay});
    for(let d=admitDay;d<0;d++){
      if(d<-4&&R()<.03)continue;
      p.readings[d]={t:d<recoverDay?rf(100.6,103.2):rf(97.4,99.3),by:pick(['n1','n2']),at:tsFor(d,ri(7,10),ri(0,59))};
      if(R()<.95)p.visits[d]={by:'d1',at:tsFor(d,ri(11,16),ri(0,59)),treatment:d<recoverDay?pick(TREATMENTS.slice(1,4)):'Observation only',note:''};
    }
  });
  // crafted case: missed reading breaks the fever-free count
  const g=st.patients.find(p=>p.status==='admitted'&&p.room==='A09');
  Object.assign(g,{admitDay:-9,recoverDay:-5,readings:{},visits:{}});
  for(let d=-9;d<0;d++){if(d===-3)continue;g.readings[d]={t:d<-5?rf(100.8,102.4):rf(97.8,99.0),by:'n2',at:tsFor(d,8,ri(0,59))};g.visits[d]={by:'d1',at:tsFor(d,13,ri(0,59)),treatment:d<-5?'Antipyretic (paracetamol)':'Observation only',note:''}}
  // eligible patients: half already approved yesterday (waiting on admin)
  S=st;
  const elig=st.patients.filter(p=>p.status==='admitted'&&streak(p).len>=3);
  elig.forEach((p,i)=>{if(i%2===0){p.status='discharge_pending';p.approvedDay=-1;p.approvedBy='d1';p.approvedAt=tsFor(-1,15,ri(0,59));p.eligibleDay=eligibleSince(p);
    st.notifs.push({role:'admin',at:p.approvedAt,day:-1,read:false,msg:`Discharge approved by Dr. Ananya Mehta for ${p.name} (Room ${p.room}).`})}});
  // today's morning round partly done
  const act=st.patients.filter(p=>p.room);
  const order=act.map(p=>[R(),p]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  order.slice(0,27).forEach((p,i)=>{
    if(p.room==='A09')return;
    const t=0<p.recoverDay?rf(100.6,103.4):rf(97.4,99.3);
    p.readings[0]={t,by:i%2?'n1':'n2',at:tsFor(0,7+Math.floor(i/9),(i*7)%60),realAt:0};
    if(t>=HIGH_F)st.notifs.push({role:'doctor',at:p.readings[0].at,day:0,read:false,msg:`High fever alert: ${p.name} (Room ${p.room}) recorded ${fmtT(t)}.`});
    if(i<9)p.visits[0]={by:'d1',at:tsFor(0,9,10+i*4),treatment:t>=st.settings.feverF?'Antipyretic (paracetamol)':'Observation only',note:''};
  });
  st.audit.push({at:tsFor(0,6,0),day:0,by:'sys',action:'Demo data loaded (72 admitted, 54 closed cases)'});
  return st;
}

/* ============ domain logic ============ */
const thr=()=>S.settings.feverF;
const isFever=t=>t>=thr();
const active=()=>S.patients.filter(p=>p.room&&(p.status==='admitted'||p.status==='discharge_pending'));
const closed=()=>S.patients.filter(p=>p.status==='discharged'||p.status==='deceased');
const rd=(p,d=S.today)=>p.readings[d];
const vs=(p,d=S.today)=>p.visits[d];
/* fever-free streak: consecutive days (ending today, or yesterday if today not yet measured) with a recorded normal temperature.
   A day with NO reading cannot be confirmed fever-free, so it breaks the streak. */
function streak(p){
  let d=S.today; if(!rd(p,d))d--;
  const end=d;let len=0;
  while(d>=p.admitDay){const r=rd(p,d);if(!r||isFever(r.t))break;len++;d--}
  let gap=null; if(d>=p.admitDay&&!rd(p,d)&&len<3)gap=d;
  return{len,end,gap};
}
const eligible=p=>streak(p).len>=3;
function eligibleSince(p){const s=streak(p);return s.len>=3?s.end-s.len+3:null}
function lastReading(p){for(let d=S.today;d>=p.admitDay;d--)if(rd(p,d))return{d,...rd(p,d)};return null}
function prevReading(p,before){for(let d=before-1;d>=p.admitDay;d--)if(rd(p,d))return{d,...rd(p,d)};return null}
function notify(role,msg){S.notifs.push({role,msg,at:nowTs(),day:S.today,read:false})}
function audit(action,pid){S.audit.push({at:nowTs(),day:S.today,by:S.user.id,action,pid})}
function stats(list){const rec=list.filter(p=>p.status==='discharged').length,dead=list.filter(p=>p.status==='deceased').length,n=rec+dead;return{rec,dead,n,succ:n?rec/n*100:null,mort:n?dead/n*100:null}}
function dots(p){const n=Math.min(3,streak(p).len);return `<span class="dots" title="Fever-free days in a row: ${streak(p).len} of 3">${'<span class="dot-on">●</span>'.repeat(n)}${'<span class="dot-off">●</span>'.repeat(3-n)}</span>`}
function tempChip(t){if(t==null)return '<span class="chip c-grey">—</span>';return `<span class="chip ${t>=HIGH_F?'c-bad':isFever(t)?'c-warn':'c-ok'}">${fmtT(t)}</span>`}

/* ============ rendering ============ */
function render(){
  const ae=document.activeElement;const fid=ae&&ae.id;const sel=ae&&ae.selectionStart;
  $('#app').innerHTML=S.user?shell():login();
  if(fid){const el=document.getElementById(fid);if(el&&!el.closest('.modal')){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
  renderNP();
}
function login(){
  const groups=['nurse','doctor','admin','head'];
  const desc={nurse:'Records each patient\'s daily temperature from a live checklist of who is still pending.',doctor:'Sees who is ready to be visited, logs visits & treatment, approves discharges.',admin:'Admits patients into free rooms and completes approved discharges.',head:'Everything a doctor can do, plus the outcomes dashboard and settings.'};
  return `<div class="login">

   <p class="small muted" style="margin-top:22px">Demo data is generated and stored only in this browser. Simulated date: <b>${dlong(S.today)}</b>. <button class="btn sm" data-act="reset">Reset demo data</button></p>

    <div class="brand"><div class="logo">✚</div><div>CareCycle<small>74-bed quarantine ward</small></div></div>
    <div class="demo" title="Demo controls — simulate the passing of days"><span>📅 <b>${dlong(S.today)}</b></span>
      <button class="tbtn" data-act="autofill" title="Fill all remaining readings and visits for today with realistic values">⚡ Auto-complete today</button>
      <button class="tbtn" data-act="nextday">Next day ▶</button></div>
    <span class="sp"></span>
    <button class="bell" data-act="np" title="Notifications">🔔${unread?`<span class="cnt">${unread}</span>`:''}</button>
    <div class="who"><div class="av ${u.role}">${u.name.replace('Dr. ','').split(' ').map(x=>x[0]).join('')}</div><div><div class="b">${u.name}</div><div class="small" style="opacity:.75">${ROLE_LABEL[u.role]}</div></div>

function tabsFor(r){
  const A=active(),T=S.today;
  const ready=A.filter(p=>rd(p)&&!vs(p)).length,wait=A.filter(p=>!rd(p)&&!vs(p)).length,dis=A.filter(p=>p.status==='admitted'&&eligible(p)).length;
  const docTabs=[['ready','Ready for visit',ready],['waiting','Waiting for temperature',wait],['discharge','Approve discharge',dis,dis>0],['visited','Visited today',A.filter(p=>vs(p)).length],['all','All patients',A.length]];
  if(r==='nurse')return[['rounds','Today\'s temperature round',A.filter(p=>!rd(p)).length]];
  if(r==='doctor')return docTabs;
  if(r==='admin'){const q=A.filter(p=>p.status==='discharge_pending').length;return[['queue','Discharge queue',q,q>0],['beds','Bed board',(74-A.length)+' free'],['admit','Admit patient'],['closed','Recent closures']]}
  if(r==='head')return[['dashboard','Outcomes dashboard'],...docTabs,['settings','Settings & audit log']];
}
function nav(){const r=S.user.role;return `<div class="nav">${tabsFor(r).map(([k,l,n,hot])=>`<button class="${UI.tab[r]===k?'on':''}" data-act="tab" data-k="${k}">${l}${n!==undefined?`<span class="n ${hot?'hot':''}">${n}</span>`:''}</button>`).join('')}</div>`}
function view(){
  const r=S.user.role,t=UI.tab[r];
  if(r==='nurse')return vNurse();
  if(r==='admin')return t==='queue'?vQueue():t==='beds'?vBeds():t==='admit'?vAdmit():vClosed();
  if(r==='head'&&t==='dashboard')return vDash();
  if(r==='head'&&t==='settings')return vSettings();
  return vDoctor(t);
}

/* ---------- nurse ---------- */
function vNurse(){
  const A=active().sort((a,b)=>a.room.localeCompare(b.room));
  const done=A.filter(p=>rd(p)).length,pend=A.length-done,prio=A.filter(p=>p.priority&&!rd(p)).length;
  let L=A.filter(p=>UI.ward==='all'||p.room[0]===UI.ward);
  if(UI.nf==='pending')L=L.filter(p=>!rd(p));else if(UI.nf==='done')L=L.filter(p=>rd(p));else if(UI.nf==='prio')L=L.filter(p=>p.priority&&!rd(p));
  if(UI.q){const q=UI.q.toLowerCase();L=L.filter(p=>p.name.toLowerCase().includes(q)||p.room.toLowerCase().includes(q)||p.id.toLowerCase().includes(q))}
  L.sort((a,b)=>(b.priority&&!rd(b))-(a.priority&&!rd(a)));
  const pct=A.length?Math.round(done/A.length*100):0;
  return `<h2>Today's temperature round</h2><p class="sub">${dlong(S.today)} · each patient needs exactly <b>one</b> reading per day. Pending patients are shown first; anything a doctor is waiting on is flagged in red.</p>
  ${prio?`<div class="banner bad">⚡ <div><b>${prio} patient${prio>1?'s':''} flagged by a doctor</b> who is waiting to do the visit. Please measure these first.</div></div>`:''}
  <div class="card"><div class="row"><b>${done} of ${A.length} measured</b><span class="muted">· ${pend} pending</span><span class="sp"></span><span class="small muted">Fever threshold: ≥ ${thr()}°F</span></div><div class="prog" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>
  <div class="tool"><div class="seg">${[['pending','Pending ('+pend+')'],['prio','Doctor waiting ('+prio+')'],['done','Recorded ('+done+')'],['all','All']].map(([k,l])=>`<button class="${UI.nf===k?'on':''}" data-act="nf" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="seg">${[['all','Both wards'],['A','Ward A'],['B','Ward B']].map(([k,l])=>`<button class="${UI.ward===k?'on':''}" data-act="ward" data-k="${k}">${l}</button>`).join('')}</div>
  <input id="q" class="inp" placeholder="Search room, name or ID…" value="${esc(UI.q)}" style="flex:1;min-width:180px"></div>
  ${L.length?`<div class="grid">${L.map(pcard).join('')}</div>`:`<div class="card empty">${UI.nf==='pending'?'🎉 Everyone has been measured today.':'Nothing to show for this filter.'}</div>`}`;
}
function pcard(p){
  const r=rd(p),prev=prevReading(p,S.today),pr=p.priority&&!r;
  const canEdit=r&&r.by===S.user.id&&r.realAt&&Date.now()-r.realAt<3600e3;
  return `<div class="pcard ${r?'done':''} ${pr?'prio':''}">
    <div class="row"><span class="room">${p.room}</span>${p.status==='discharge_pending'?'<span class="chip c-info">Discharge approved</span>':''}${pr?'<span class="chip c-bad">⚡ Doctor waiting</span>':''}<span class="sp"></span>${r?'<span class="chip c-ok">✓ Done</span>':'<span class="chip c-warn">Pending</span>'}</div>
    <div><div class="pname">${esc(p.name)}</div><div class="small muted">${p.id} · ${p.age}${p.sex} · day ${S.today-p.admitDay+1} of stay</div></div>
    <div class="small row"><span class="muted">Last:</span> ${prev?fmtT(prev.t)+' <span class="muted">('+rel(prev.d)+')</span>':'<span class="muted">first reading</span>'}<span class="sp"></span>${dots(p)}</div>
    ${r?`<div class="recd ${isFever(r.t)?'fev':''}"><b>${fmtT(r.t)}</b><span>at ${hm(r.at)} · ${short(r.by)}</span><span class="sp"></span>${canEdit?`<button class="btn sm" data-act="rec" data-id="${p.id}" data-edit="1">Correct</button>`:''}</div>`
       :`<button class="btn pri full" data-act="rec" data-id="${p.id}">Record temperature</button>`}
  </div>`;
}
function openRecord(id,edit){
  const p=S.patients.find(x=>x.id===id);const r=rd(p);
  if(r&&!edit){toast(`Already recorded today by ${uname(r.by)} at ${hm(r.at)}. Only one reading per day is allowed.`,'bad');return}
  const prev=prevReading(p,S.today);
  modal(`<div class="mh"><div><h3 style="margin:0">${edit?'Correct reading':'Record temperature'} · Room ${p.room}</h3><div class="muted small">${esc(p.name)} · ${p.id} · ${dlong(S.today)}</div></div><button class="x" data-act="close">×</button></div>
  <div class="mb">
   <div class="kv" style="margin-bottom:14px"><span>Previous reading</span><span>${prev?fmtT(prev.t)+' ('+rel(prev.d)+')':'None: first reading after admission'}</span><span>Fever-free streak</span><span>${streak(p).len} of 3 days ${dots(p)}</span></div>
   <div class="row" style="justify-content:space-between"><label class="b small">Temperature</label><div class="seg"><button class="${UI.unit==='F'?'on':''}" data-act="unit" data-k="F">°F</button><button class="${UI.unit==='C'?'on':''}" data-act="unit" data-k="C">°C</button></div></div>
   <input id="tIn" class="inp bigtemp" type="number" step="0.1" inputmode="decimal" placeholder="${UI.unit==='F'?'e.g. 98.6':'e.g. 37.0'}" value="${edit&&r?(UI.unit==='F'?r.t:f2c(r.t).toFixed(1)):''}" data-id="${p.id}">
   <div id="tMsg" class="msg"></div>
   ${edit?`<div class="field" style="margin-top:8px"><label>Reason for correction (kept in audit log)</label><select id="why" class="inp"><option value="">Select a reason…</option><option>Typing mistake</option><option>Re-measured, first value was wrong</option><option>Entered against wrong patient</option></select></div>`:''}
  </div>
  <div class="mf"><button class="btn" data-act="close">Cancel</button><button id="tSave" class="btn pri" data-act="saveTemp" data-id="${p.id}" data-edit="${edit?1:''}" disabled>Save reading</button></div>`);
  const i=$('#tIn');i.focus();validateTemp();
}
function readTempF(){const v=parseFloat($('#tIn').value);if(isNaN(v))return null;return UI.unit==='F'?v:c2f(v)}
function validateTemp(){
  const f=readTempF(),m=$('#tMsg'),b=$('#tSave');if(!m)return;
  const p=S.patients.find(x=>x.id===$('#tIn').dataset.id);const prev=prevReading(p,S.today);
  let ok=false,h='';
  if(f==null)h='<span class="muted">Enter the thermometer reading.</span>';
  else if(f<MIN_F||f>MAX_F)h=`<span style="color:var(--bad)">⛔ ${UI.unit==='F'?f.toFixed(1)+'°F':$('#tIn').value+'°C'} is outside the possible range (${MIN_F}–${MAX_F}°F). Please re-check the unit or re-measure.</span>`;
  else{ok=true;
    const c=` <span class="muted">(${fmtT(f)} / ${f2c(f).toFixed(1)}°C)</span>`;
    if(f>=HIGH_F)h=`<span style="color:var(--bad)">🔴 High fever. The doctor will be alerted as soon as you save.</span>`+c;
    else if(isFever(f))h=`<span style="color:var(--warn)">🟠 Fever (≥ ${thr()}°F). The fever-free count will restart.</span>`+c;
    else h=`<span style="color:var(--ok)">🟢 No fever.</span>`+c;
    if(prev&&Math.abs(f-prev.t)>=3)h+=`<br><span style="color:var(--warn)">⚠ Big change from the last reading (${fmtT(prev.t)}). Please double-check before saving.</span>`;
  }
  const why=$('#why');if(why&&!why.value)ok=false;
  m.innerHTML=h;b.disabled=!ok;
}
function saveTemp(id,edit){
  const p=S.patients.find(x=>x.id===id);const f=Math.round(readTempF()*10)/10;
  const before=eligible(p);
  if(edit){const r=rd(p);r.history=(r.history||[]).concat({t:r.t,at:r.at});audit(`Corrected reading ${fmtT(r.t)} → ${fmtT(f)} (${$('#why').value})`,id);r.t=f;r.at=nowTs();}
  else{if(rd(p)){closeModal();toast('Someone else just recorded this patient. Reading not saved twice.','bad');render();return}
    p.readings[S.today]={t:f,by:S.user.id,at:nowTs(),realAt:Date.now()};p.priority=false;audit(`Recorded temperature ${fmtT(f)}`,id);}
  if(f>=HIGH_F)notify('doctor',`High fever alert: ${p.name} (Room ${p.room}) recorded ${fmtT(f)}.`);
  if(isFever(f)&&p.status==='discharge_pending'){p.status='admitted';delete p.approvedDay;notify('admin',`Discharge CANCELLED for ${p.name} (Room ${p.room}): fever returned (${fmtT(f)}).`);notify('doctor',`Fever returned for ${p.name} (Room ${p.room}). Discharge approval withdrawn.`);}
  if(!before&&eligible(p)&&p.status==='admitted')notify('doctor',`${p.name} (Room ${p.room}) now meets the 3-day fever-free criterion. Ready for discharge approval.`);
  save();closeModal();render();
  toast(`${fmtT(f)} saved for Room ${p.room}${eligible(p)&&!before?' · now eligible for discharge 🎉':''}`,'ok');
}

/* ---------- doctor ---------- */
function vDoctor(t){
  const A=active();let L,title,sub,empty;
  if(t==='ready'){L=A.filter(p=>rd(p)&&!vs(p)).sort((a,b)=>rd(b).t-rd(a).t);title='Ready for visit';sub='Temperature already taken today, not yet visited. Sorted with the highest fever first so the sickest patients are seen first.';empty='No one is waiting. Check "Waiting for temperature".'}
  else if(t==='waiting'){L=A.filter(p=>!rd(p)&&!vs(p)).sort((a,b)=>a.room.localeCompare(b.room));title='Waiting for temperature';sub='Visiting these now would mean measuring the temperature yourself. Use "Ask nurse" to put them at the top of the nurses\' list.';empty='Every patient has been measured.'}
  else if(t==='discharge'){L=A.filter(p=>p.status==='admitted'&&eligible(p));title='Approve discharge';sub='These patients have 3 full days in a row with no fever. Approving sends them straight to the admin discharge queue, so there\'s no need to inform admin separately.';empty='No patient currently meets the discharge criterion.'}
  else if(t==='visited'){L=A.filter(p=>vs(p)).sort((a,b)=>vs(b).at-vs(a).at);title='Visited today';sub='Completed visits for today.';empty='No visits logged yet today.'}
  else{L=A.slice().sort((a,b)=>a.room.localeCompare(b.room));title='All admitted patients';sub=`${A.length} patients currently admitted.`;empty='No patients.'}
  if(UI.dq){const q=UI.dq.toLowerCase();L=L.filter(p=>p.name.toLowerCase().includes(q)||p.room.toLowerCase().includes(q)||p.id.toLowerCase().includes(q))}
  return `<h2>${title}</h2><p class="sub">${sub}</p>
   <div class="tool"><input id="dq" class="inp" placeholder="Search room, name or ID…" value="${esc(UI.dq)}" style="flex:1;max-width:340px"><span class="sp"></span><span class="small muted">● = fever-free day (3 needed for discharge)</span></div>
   <div class="list"><div class="li h"><span>Room</span><span>Patient</span><span>Today</span><span class="hide-m">Fever-free streak</span><span></span></div>
   ${L.length?L.map(p=>docRow(p,t)).join(''):`<div class="empty">${empty}</div>`}</div>`;
}
function docRow(p,t){
  const r=rd(p),v=vs(p),s=streak(p);
  let act=`<button class="btn sm" data-act="open" data-id="${p.id}">Open</button>`;
  if(t==='ready')act=`<button class="btn sm pri" data-act="open" data-id="${p.id}">Start visit</button>`;
  if(t==='waiting')act=p.priority?`<span class="chip c-info">Nurse notified</span> <button class="btn sm" data-act="open" data-id="${p.id}">Open</button>`:`<button class="btn sm" data-act="prio" data-id="${p.id}">Ask nurse</button> <button class="btn sm" data-act="open" data-id="${p.id}">Open</button>`;
  if(t==='discharge')act=`<button class="btn sm pri" data-act="approve" data-id="${p.id}">Approve discharge</button> <button class="btn sm" data-act="open" data-id="${p.id}">Open</button>`;
  const st=p.status==='discharge_pending'?'<span class="chip c-info">With admin</span>':v?'<span class="chip c-ok">Visited '+hm(v.at)+'</span>':'';
  return `<div class="li click" data-act="open" data-id="${p.id}"><span class="room">${p.room}</span>
   <span><b>${esc(p.name)}</b> <span class="small muted">${p.age}${p.sex} · day ${S.today-p.admitDay+1}</span><br>${st}</span>
   <span>${r?tempChip(r.t)+' <span class="small muted">'+hm(r.at)+'</span>':'<span class="chip c-grey">Not measured</span>'}</span>
   <span class="hide-m">${dots(p)} <span class="small muted">${s.len} day${s.len===1?'':'s'}${s.gap!=null?' · missed '+dl(s.gap):''}</span></span>
   <span class="row" style="justify-content:flex-end">${act}</span></div>`;
}
function chart(p){
  const from=Math.max(p.admitDay,S.today-13),days=[];for(let d=from;d<=S.today;d++)days.push(d);
  const W=740,H=190,pl=40,pr=12,pt=12,pb=26,lo=96,hi=105;
  const x=i=>pl+(days.length===1?0:(i*(W-pl-pr)/(days.length-1))),y=t=>pt+(hi-Math.min(hi,Math.max(lo,t)))*(H-pt-pb)/(hi-lo);
  let pts=[],g='';
  for(let t=96;t<=105;t+=1)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#eef1f4"/><text x="${pl-6}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="#8a96a3">${t}</text>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(thr())}" y2="${y(thr())}" stroke="#c62828" stroke-dasharray="5 4"/><text x="${W-pr}" y="${y(thr())-5}" font-size="10" text-anchor="end" fill="#c62828">fever ≥ ${thr()}°F</text>`;
  days.forEach((d,i)=>{const r=rd(p,d);g+=`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#8a96a3">${dateOf(d).getDate()}</text>`;
    if(r)pts.push([x(i),y(r.t),r.t]);else if(d<S.today)g+=`<text x="${x(i)}" y="${H-pb-4}" font-size="12" text-anchor="middle" fill="#c62828" font-weight="700">×</text>`;});
  const path=pts.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Temperature chart">${g}<path d="${path}" fill="none" stroke="#0f766e" stroke-width="2"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${q[2]>=thr()?'#c62828':'#15803d'}"/>`).join('')}</svg><div class="small muted">Last ${days.length} days · × = no reading recorded that day</div>`;
}
function openPatient(id){
  const p=S.patients.find(x=>x.id===id);const r=rd(p),v=vs(p),s=streak(p),role=S.user.role,doc=role==='doctor'||role==='head';
  const visits=Object.keys(p.visits).map(Number).sort((a,b)=>b-a).slice(0,5);
  let visitBox='';
  if(doc){
    if(v)visitBox=`<div class="banner ok">✓ <div>Visited today at ${hm(v.at)} by ${uname(v.by)} · <b>${esc(v.treatment)}</b>${v.note?'<br>'+esc(v.note):''}${v.override?'<br><span class="small">Visited before temperature: '+esc(v.override)+'</span>':''}</div></div>`;
    else visitBox=`${!r?`<div class="banner warn">⚠ <div><b>Temperature not recorded yet today.</b> Normally the nurse measures first. You can ask the nurse to prioritise this patient, or continue only if it's urgent (a reason is required).</div></div>`:''}
     <div class="field"><label>Treatment decision</label><select id="vT" class="inp">${TREATMENTS.map(t=>`<option ${(r&&isFever(r.t)?t==='Antipyretic (paracetamol)':t==='Observation only')?'selected':''}>${t}</option>`).join('')}</select></div>
     <div class="field"><label>Visit note (optional)</label><textarea id="vN" class="inp" rows="2" placeholder="e.g. Responding to antipyretic, hydration good"></textarea></div>
     ${!r?`<div class="field"><label>Reason for visiting before temperature *</label><select id="vO" class="inp"><option value="">Select…</option><option>Emergency / patient deteriorating</option><option>Patient requested urgent review</option><option>Measured temperature myself during visit</option></select></div>`:''}
     <div class="row">${!r&&!p.priority?`<button class="btn" data-act="prio" data-id="${p.id}" data-close="1">Ask nurse to measure first</button>`:''}<span class="sp"></span><button class="btn pri" data-act="visit" data-id="${p.id}">Complete visit</button></div>`;
  }
  const discharge=p.status==='discharge_pending'?`<div class="banner info">ℹ <div>Discharge approved ${rel(p.approvedDay)} at ${hm(p.approvedAt)} by ${uname(p.approvedBy)}. Waiting for admin to complete it.</div></div>`
    :eligible(p)?`<div class="banner ok">🎉 <div><b>Meets the discharge criterion</b>: ${s.len} full days in a row without fever. ${doc?`<div style="margin-top:8px"><button class="btn pri sm" data-act="approve" data-id="${p.id}">Approve discharge → send to admin</button></div>`:''}</div></div>`
    :`<div class="banner grey"><div>Fever-free streak: <b>${s.len} of 3 days</b> ${dots(p)}${s.gap!=null?`<br><span style="color:var(--bad)">No reading on ${dl(s.gap)}, so the count restarted (a day without a reading can't be confirmed fever-free).</span>`:''}</div></div>`;

/* ---------- head doctor ---------- */
function vDash(){
  const C=closed(),all=stats(C),r30=stats(C.filter(p=>p.closedDay>S.today-30)),A=active();
  const ms=S.settings.minSample;
  let ban;
  if(all.n<ms)ban=`<div class="banner grey">ℹ Only ${all.n} closed cases so far. The rate becomes reliable after ${ms}, so no alert is raised yet.</div>`;
  else if(all.mort>MORT_LIMIT)ban=`<div class="banner bad">🔴 <div><b>Mortality is ${all.mort.toFixed(1)}%, above the expected ${MORT_LIMIT}%.</b> Success rate ${all.succ.toFixed(1)}% is below the ${TARGET}% benchmark. Review recent deaths and treatment protocols.</div></div>`;
  else if(all.mort>MORT_LIMIT-1)ban=`<div class="banner warn">🟠 <div><b>Close to the limit:</b> mortality ${all.mort.toFixed(1)}% vs expected ${MORT_LIMIT}%. One or two more deaths would cross it.</div></div>`;
  else ban=`<div class="banner ok">🟢 Outcomes are within the expected range.</div>`;
  if(r30.n>=ms&&r30.succ<TARGET)ban+=`<div class="banner warn">📉 <div><b>Recent dip:</b> success rate over the last 30 days is ${r30.succ.toFixed(1)}% (n=${r30.n}), below the ${TARGET}% benchmark, even though the all-time figure looks fine. Worth reviewing recent cases.</div></div>`;
  const rec=C.filter(p=>p.status==='discharged');
  const los=rec.length?rec.reduce((s,p)=>s+(p.closedDay-p.admitDay),0)/rec.length:0;
  const delays=rec.filter(p=>p.eligibleDay!=null&&p.closedDay>S.today-30).map(p=>Math.max(0,p.closedDay-p.eligibleDay));
  const avgDelay=delays.length?delays.reduce((a,b)=>a+b,0)/delays.length:0,lost=delays.reduce((a,b)=>a+b,0);
  const tr=A.filter(p=>rd(p)).length,tv=A.filter(p=>vs(p)).length,ov=A.filter(p=>vs(p)&&vs(p).override).length;
  const y=S.today-1,yA=S.patients.filter(p=>p.admitDay<=y&&(p.closedDay==null||p.closedDay>y));
  const ym=yA.filter(p=>!p.readings[y]).length;
  const meter=(val,mark,good)=>`<div class="meter"><i style="width:${Math.min(100,val)}%;background:${good?'#16a34a':'#dc2626'}"></i><b style="left:${mark}%"></b></div>`;
  // weekly outcome chart (last 8 weeks)
  const wk=[];for(let w=7;w>=0;w--){const a=S.today-7*w-6,b=S.today-7*w;const L=C.filter(p=>p.closedDay>=a&&p.closedDay<=b);wk.push({lab:dl(a),rec:L.filter(p=>p.status==='discharged').length,dead:L.filter(p=>p.status==='deceased').length})}
  const mx=Math.max(4,...wk.map(w=>w.rec+w.dead)),W=560,H=170,bw=44;
  const bars=wk.map((w,i)=>{const x=40+i*((W-50)/8),hR=w.rec/mx*(H-40),hD=w.dead/mx*(H-40);return `<rect x="${x}" y="${H-22-hR}" width="${bw}" height="${hR}" fill="#14b8a6" rx="3"/><rect x="${x}" y="${H-22-hR-hD}" width="${bw}" height="${hD}" fill="#ef4444" rx="3"/><text x="${x+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="#8a96a3">${w.lab}</text>${w.rec+w.dead?`<text x="${x+bw/2}" y="${H-26-hR-hD}" font-size="10" text-anchor="middle" fill="#334155">${w.rec+w.dead}</text>`:''}`}).join('');
  return `<h2>Outcomes dashboard</h2><p class="sub">How the centre is doing against the 85% success benchmark, and how smoothly the daily cycle is running. Success rate counts <b>closed cases only</b> (recovered ÷ recovered + deceased); patients still admitted are excluded so they don't distort the rate.</p>${ban}
  <div class="kpis">
   <div class="card kpi"><div class="l">Success rate (all closed cases)</div><div class="v" style="color:${all.succ>=TARGET?'var(--ok)':'var(--bad)'}">${all.succ!=null?all.succ.toFixed(1)+'%':'—'}</div>${meter(all.succ||0,TARGET,all.succ>=TARGET)}<div class="small muted">${all.rec} recovered · ${all.dead} deceased · n=${all.n} · target line at ${TARGET}%</div></div>
   <div class="card kpi"><div class="l">Mortality rate</div><div class="v" style="color:${all.mort>MORT_LIMIT?'var(--bad)':all.mort>MORT_LIMIT-1?'var(--warn)':'var(--ok)'}">${all.mort!=null?all.mort.toFixed(1)+'%':'—'}</div>${meter((all.mort||0)/30*100,MORT_LIMIT/30*100,all.mort<=MORT_LIMIT)}<div class="small muted">Expected ≤ ${MORT_LIMIT}% · scale 0–30%</div></div>
   <div class="card kpi"><div class="l">Last 30 days</div><div class="v">${r30.succ!=null?r30.succ.toFixed(1)+'%':'—'}</div><div class="small muted">${r30.rec} recovered · ${r30.dead} deceased (n=${r30.n})${r30.n<ms?' · small sample, read with care':''}</div></div>
   <div class="card kpi"><div class="l">Occupancy</div><div class="v">${A.length}<span style="font-size:16px;color:var(--muted)"> / 74</span></div><div class="prog" style="margin-top:10px"><i style="width:${A.length/74*100}%"></i></div><div class="small muted" style="margin-top:4px">${A.filter(p=>p.status==='discharge_pending').length} discharge${A.filter(p=>p.status==='discharge_pending').length===1?'':'s'} awaiting admin</div></div>
   <div class="card kpi"><div class="l">Today's round</div><div class="v">${tr}<span style="font-size:16px;color:var(--muted)"> / ${A.length} measured</span></div><div class="small">${tv} / ${A.length} visited · <span style="color:${ov?'var(--warn)':'var(--muted)'}">${ov} visit${ov===1?'':'s'} before temperature</span></div><div class="small muted">Yesterday: ${ym} missed reading${ym===1?'':'s'}</div></div>
   <div class="card kpi"><div class="l">Discharge delay (last 30 days)</div><div class="v">${avgDelay.toFixed(1)}<span style="font-size:16px;color:var(--muted)"> days</span></div><div class="small muted">Average gap between becoming eligible and leaving · <b style="color:var(--bad)">${lost} bed-days lost</b> · avg stay ${los.toFixed(1)} days</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Closed cases per week</h3><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:640px">${bars}</svg><div class="legend"><span><i style="background:#14b8a6"></i>Recovered</span><span><i style="background:#ef4444"></i>Deceased</span><span class="muted">Week starting</span></div></div>`;
}

function autofill(){

  A.forEach(p=>{
    if(!rd(p)){const fever=S.today<p.recoverDay;const t=Math.round((fever?100.6+Math.random()*2.6:97.4+Math.random()*1.9)*10)/10;p.readings[S.today]={t,by:'n1',at:tsFor(S.today,8,Math.floor(Math.random()*59))};nr++;

    if(!vs(p)){p.visits[S.today]={by:'d1',at:tsFor(S.today,13,Math.floor(Math.random()*59)),treatment:isFever(rd(p).t)?'Antipyretic (paracetamol)':'Observation only',note:''};nv++}
  });
  const el=A.filter(p=>p.status==='admitted'&&eligible(p)).length;
  if(el)notify('doctor',`${el} patient${el>1?'s':''} now meet${el>1?'':'s'} the discharge criterion.`);
  S.audit.push({at:nowTs(),day:S.today,by:'sys',action:`Demo auto-complete: ${nr} readings, ${nv} visits`});
  save();render();toast(`Demo: filled ${nr} readings and ${nv} visits for today.`,'ok');
}
function nextDayDlg(){
  const A=active(),mr=A.filter(p=>!rd(p)).length,mv=A.filter(p=>!vs(p)).length,pd=A.filter(p=>p.status==='discharge_pending').length;
  if(!mr&&!mv&&!pd)return nextDay();
  modal(`<div class="mh"><h3 style="margin:0">End ${dlong(S.today)}?</h3><button class="x" data-act="close">×</button></div>
  <div class="mb">${mr?`<div class="banner warn">⚠ <b>${mr}</b> patient${mr>1?'s have':' has'} no temperature today. Their fever-free count will restart, which may delay their discharge.</div>`:''}
  ${mv?`<div class="banner warn">⚠ <b>${mv}</b> patient${mv>1?'s were':' was'} not visited by a doctor today.</div>`:''}
  ${pd?`<div class="banner info">ℹ <b>${pd}</b> approved discharge${pd>1?'s are':' is'} still pending with admin. Each one becomes overdue tomorrow.</div>`:''}
  <p class="muted small">In the real app the day rolls over automatically at midnight and these counts go to the head doctor's dashboard.</p></div>
  <div class="mf"><button class="btn" data-act="close">Stay on today</button><button class="btn pri" data-act="nextGo">Go to next day ▶</button></div>`);
}
function nextDay(){
  const A=active();const pd=A.filter(p=>p.status==='discharge_pending');
  A.forEach(p=>p.priority=false);S.today++;
  if(pd.length){notify('admin',`⏱ ${pd.length} discharge${pd.length>1?'s are':' is'} overdue from yesterday. Please complete ${pd.length>1?'them':'it'} first.`);notify('head',`${pd.length} approved discharge${pd.length>1?'s were':' was'} not completed yesterday.`)}
  S.audit.push({at:tsFor(S.today,0,0),day:S.today,by:'sys',action:'New day started'});
  closeModal();save();render();toast('It is now '+dlong(S.today),'ok');
}

/* ============ modal / toast ============ */
function modal(html,wide){$('#modal-root').innerHTML=`<div class="overlay" data-act="ovl"><div class="modal ${wide?'wide':''}">${html}</div></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(()=>t.remove(),3800)}

/* ============ events ============ */
const H={
  login:el=>{S.user=USERS.find(u=>u.id===el.dataset.id);save();render()},
  logout:()=>{S.user=null;UI.np=false;save();render()},
  reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();save();render();toast('Demo data reset.','ok')},
  tab:el=>{UI.tab[S.user.role]=el.dataset.k;render();window.scrollTo(0,0)},
  nf:el=>{UI.nf=el.dataset.k;render()}, ward:el=>{UI.ward=el.dataset.k;render()},
  rec:el=>openRecord(el.dataset.id,!!el.dataset.edit),
  unit:el=>{const i=$('#tIn');const f=readTempF();UI.unit=el.dataset.k;document.querySelectorAll('[data-act=unit]').forEach(b=>b.classList.toggle('on',b.dataset.k===UI.unit));if(f!=null)i.value=(UI.unit==='F'?f:f2c(f)).toFixed(1);i.placeholder=UI.unit==='F'?'e.g. 98.6':'e.g. 37.0';validateTemp()},
  saveTemp:el=>saveTemp(el.dataset.id,!!el.dataset.edit),
  open:(el,e)=>{if(e.target.closest('button')&&e.target.closest('button')!==el)return;openPatient(el.dataset.id)},
  prio:(el,e)=>{e.stopPropagation();const p=S.patients.find(x=>x.id===el.dataset.id);p.priority=true;notify('nurse',`⚡ ${S.user.name} is waiting to visit ${p.name} (Room ${p.room}). Please measure temperature first.`);audit('Requested priority temperature reading',p.id);save();if(el.dataset.close)closeModal();render();toast(`Nurses notified: Room ${p.room} moved to the top of their list.`,'ok')},
  visit:el=>completeVisit(el.dataset.id),
  approve:(el,e)=>{e.stopPropagation();approve(el.dataset.id)}, approveGo:el=>approveGo(el.dataset.id),
  death:el=>deathDlg(el.dataset.id), deathGo:el=>deathGo(el.dataset.id),
  disch:el=>dischDlg(el.dataset.id), dischGo:el=>dischGo(el.dataset.id),
  admitRoom:el=>{admitRoom=el.dataset.k;UI.tab.admin='admit';render()},
  admitGo:()=>admitGo(false), admitForce:()=>admitGo(true),
  saveSet, autofill, nextday:nextDayDlg, nextGo:nextDay,
  np:()=>{UI.np=!UI.np;if(!UI.np)myNotifs().forEach(n=>n.read=true);save();render()},
  readall:()=>{myNotifs().forEach(n=>n.read=true);UI.np=false;save();render()},
  close:closeModal, ovl:(el,e)=>{if(e.target===el)closeModal()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(UI.np&&!e.target.closest('.np')&&!(el&&el.dataset.act==='np')){UI.np=false;myNotifs().forEach(n=>n.read=true);save();render()}
  if(!el)return;const f=H[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){UI.q=e.target.value;render()}
  else if(e.target.id==='dq'){UI.dq=e.target.value;render()}
  else if(e.target.id==='tIn')validateTemp();
});
document.addEventListener('change',e=>{if(e.target.id==='why')validateTemp()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target.id==='tIn'){const b=$('#tSave');if(b&&!b.disabled)b.click()}
});

/* ============ boot ============ */
S=load();if(!S||S.v!==1){S=seed();save()}
render();
</script>
</body>
</html>
